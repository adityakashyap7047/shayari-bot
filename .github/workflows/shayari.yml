name: Shayari Reel Automation (Multi-Channel)

on:
  schedule:
    # Har 4 ghante run — 6 runs/day × 5 channels = 30 reels max (fits quota)
    - cron: '0 */4 * * *'
  workflow_dispatch:
    # Manual bhi trigger kar sakte ho GitHub se
    inputs:
      channel:
        description: 'Specific channel ID (leave empty for all channels)'
        required: false
        default: ''

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system deps + font + Python packages (parallel)
        run: |
          # Start apt install in background
          sudo apt-get update -qq &
          APT_PID=$!

          # Meanwhile, install Python deps (uses cached wheels)
          pip install -q -r requirements.txt &
          PIP_PID=$!

          # Wait for apt update to finish, then install packages
          wait $APT_PID
          sudo apt-get install -y --no-install-recommends imagemagick ffmpeg &
          APT_INSTALL_PID=$!

          # Wait for both to finish
          wait $PIP_PID
          wait $APT_INSTALL_PID

          # Fix ImageMagick policy — default Ubuntu policy blocks text rendering
          if [ -f /etc/ImageMagick-6/policy.xml ]; then
            sudo sed -i 's/rights="none" pattern="@\*"/rights="read|write" pattern="@*"/' /etc/ImageMagick-6/policy.xml
            sudo sed -i '/<policy domain="path" rights="none" pattern="@\*"/d' /etc/ImageMagick-6/policy.xml
            echo "✅ ImageMagick policy fixed"
          fi

          # Download font if missing
          mkdir -p fonts
          if [ ! -f fonts/NotoSansDevanagari.ttf ]; then
            curl -sL -o fonts/NotoSansDevanagari.ttf \
              "https://github.com/google/fonts/raw/main/ofl/notosansdevanagari/NotoSansDevanagari%5Bwdth%2Cwght%5D.ttf"
            echo "✅ Font downloaded"
          fi

          echo "✅ All dependencies ready"

      - name: Setup credentials for all channels
        env:
          # ── Shared API keys ────────────────────────────────
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}

          # ── Channel: shayari_official ───────────────────────
          CHANNEL_SHAYARI_OFFICIAL_CLIENT_SECRETS: ${{ secrets.CHANNEL_SHAYARI_OFFICIAL_CLIENT_SECRETS }}
          CHANNEL_SHAYARI_OFFICIAL_TOKEN: ${{ secrets.CHANNEL_SHAYARI_OFFICIAL_TOKEN }}

          # ── Channel: dard_diary ─────────────────────────────
          CHANNEL_DARD_DIARY_CLIENT_SECRETS: ${{ secrets.CHANNEL_DARD_DIARY_CLIENT_SECRETS }}
          CHANNEL_DARD_DIARY_TOKEN: ${{ secrets.CHANNEL_DARD_DIARY_TOKEN }}

          # ── Channel: ishq_shayari ───────────────────────────
          CHANNEL_ISHQ_SHAYARI_CLIENT_SECRETS: ${{ secrets.CHANNEL_ISHQ_SHAYARI_CLIENT_SECRETS }}
          CHANNEL_ISHQ_SHAYARI_TOKEN: ${{ secrets.CHANNEL_ISHQ_SHAYARI_TOKEN }}

          # ── Channel: rishte_kahani ──────────────────────────
          CHANNEL_RISHTE_KAHANI_CLIENT_SECRETS: ${{ secrets.CHANNEL_RISHTE_KAHANI_CLIENT_SECRETS }}
          CHANNEL_RISHTE_KAHANI_TOKEN: ${{ secrets.CHANNEL_RISHTE_KAHANI_TOKEN }}

          # ── Channel: zindagi_vibes ──────────────────────────
          CHANNEL_ZINDAGI_VIBES_CLIENT_SECRETS: ${{ secrets.CHANNEL_ZINDAGI_VIBES_CLIENT_SECRETS }}
          CHANNEL_ZINDAGI_VIBES_TOKEN: ${{ secrets.CHANNEL_ZINDAGI_VIBES_TOKEN }}
        run: |
          # Create .env with API keys
          echo "GEMINI_API_KEY=${GEMINI_API_KEY}" > .env
          echo "ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}" >> .env

          # Setup all channel credentials in one shot
          for channel_info in \
            "shayari_official:CHANNEL_SHAYARI_OFFICIAL_CLIENT_SECRETS:CHANNEL_SHAYARI_OFFICIAL_TOKEN" \
            "dard_diary:CHANNEL_DARD_DIARY_CLIENT_SECRETS:CHANNEL_DARD_DIARY_TOKEN" \
            "ishq_shayari:CHANNEL_ISHQ_SHAYARI_CLIENT_SECRETS:CHANNEL_ISHQ_SHAYARI_TOKEN" \
            "rishte_kahani:CHANNEL_RISHTE_KAHANI_CLIENT_SECRETS:CHANNEL_RISHTE_KAHANI_TOKEN" \
            "zindagi_vibes:CHANNEL_ZINDAGI_VIBES_CLIENT_SECRETS:CHANNEL_ZINDAGI_VIBES_TOKEN"
          do
            IFS=':' read -r ch_id cs_var tk_var <<< "$channel_info"
            mkdir -p "channels/${ch_id}"

            cs_val="${!cs_var}"
            tk_val="${!tk_var}"

            if [ -n "$cs_val" ]; then
              printf '%s' "$cs_val" > "channels/${ch_id}/client_secrets.json"
              echo "✅ ${ch_id} client_secrets written"
            else
              echo "⚠ ${cs_var} is empty!"
            fi

            if [ -n "$tk_val" ]; then
              printf '%s' "$tk_val" > "channels/${ch_id}/token.json"
              echo "✅ ${ch_id} token written"
            else
              echo "⚠ ${tk_var} is empty!"
            fi
          done

          echo ""
          echo "📋 Credentials setup complete!"

      - name: Verify channel configuration
        run: python main.py --list-channels

      - name: Generate and Upload Reels
        run: |
          if [ -n "${{ github.event.inputs.channel }}" ]; then
            echo "🎯 Running for specific channel: ${{ github.event.inputs.channel }}"
            python main.py --once --channel "${{ github.event.inputs.channel }}"
          else
            echo "🔄 Running for ALL enabled channels"
            python main.py --once
          fi

      - name: Commit updated shayari collections (used_ids tracking)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add shayari collection changes (used_ids tracking)
          git add channels/*/shayari_collection.json

          if git diff --cached --quiet; then
            echo "No shayari collection changes to commit"
          else
            git commit -m "🔄 Update used_ids in shayari collections [skip ci]"
            git push
            echo "✅ Shayari collections updated"
          fi

      - name: Save logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-logs-${{ github.run_number }}
          path: |
            automation.log
            output/
          retention-days: 7
